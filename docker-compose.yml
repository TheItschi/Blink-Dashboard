services:
  blink-dashboard:
    build: .
    container_name: blink-dashboard
    ports:
      - "9999:9999"
    volumes:
      # Gesamtes data/-Verzeichnis einbinden – bleibt beim Neustart erhalten
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      # Zeitzone für die Anzeige der Aufnahmezeiten (Blink liefert UTC).
      # Auf die eigene Zone anpassen, z.B. Europe/Vienna, America/New_York.
      - TZ=Europe/Berlin
    restart: unless-stopped
